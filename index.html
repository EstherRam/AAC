<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <!-- Viewport meta tag (MDN) -->
  <!-- Source: https://developer.mozilla.org/en-US/docs/Web/HTML/Viewport_meta_tag -->
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>OpenVoice – AAC Prototype</title>

  <style>
    /* Start of code from MDN CSS box-sizing
       Source: https://developer.mozilla.org/en-US/docs/Web/CSS/box-sizing */
    * {
      box-sizing: border-box;
      font-family: system-ui, sans-serif;
    }
    /* End of code from MDN CSS box-sizing */

    body {
      margin: 0;
      background: #121827;
      color: #ffffff;
      display: flex;
      justify-content: center;
    }

    /* App container sized to iPad Pro 11" portrait (834px wide) */
    .app {
      width: 100%;
      max-width: 834px;
      min-height: 100vh;
      padding: 16px;
    }

    /* ---------- HEADER ---------- */
    .top-bar {
      background: #1b2332;
      padding: 16px;
      text-align: center;
      border-radius: 12px;
      margin-bottom: 16px;
    }

    .top-bar h1 {
      margin: 0;
      font-size: 20px;
    }

    /* ---------- TABS ---------- */
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .tabs button {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: none;
      background: #4b556b;
      color: white;
      font-size: 12px;
      cursor: pointer;
    }

    .tabs button.active {
      background: #3f61ff;
    }

    /* ---------- SENTENCE BAR ---------- */
    .sentence-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }

    .sentence-bar input {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      border: none;
      font-size: 16px;
    }

    .sentence-bar button {
      padding: 12px;
      border-radius: 8px;
      border: none;
      background: #3a4252;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    /* ---------- SECTIONS ---------- */
    h2 {
      font-size: 14px;
      opacity: 0.85;
      margin: 16px 0 8px;
    }

    /* Start of code from MDN CSS Grid Layout
       Source: https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_Grid_Layout */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }
    /* End of code from MDN CSS Grid Layout */

    /* ---------- BUTTONS ---------- */
    /* Fallback background so buttons never disappear */
    button {
      background: #3a4252;
      color: white;
    }

    /* Start of code from MDN clamp()
       Source: https://developer.mozilla.org/en-US/docs/Web/CSS/clamp */
    .tile {
      padding: clamp(16px, 4vw, 28px);
      border-radius: 14px;
      border: none;
      font-size: clamp(14px, 2.5vw, 18px);
      cursor: pointer;

      /* Icon + label layout */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-align: center;
    }
    /* End of code from MDN clamp() */

    .tile img {
      width: 50px;
      height: 50px;
      object-fit: contain;
      display: block;
    }

    .tile span {
      display: block;
      line-height: 1.1;
    }

    /* ---------- COLORS ---------- */
    .tile.blue { background: #3f61ff; }
    .tile.purple { background: #7c3aed; }
    .tile.green { background: #3fb3a2; }
    .tile.orange { background: #d96b2b; }
    .tile.grey { background: #3a4252; }

    /* ---------- ACCESSIBILITY ---------- */
    /* Source: https://developer.mozilla.org/en-US/docs/Web/CSS/:focus-visible */
    button:focus-visible,
    input:focus-visible {
      outline: 3px solid white;
      outline-offset: 2px;
    }

    /* ---------- RESPONSIVE TABS ---------- */
    @media (max-width: 480px) {
      .tabs button {
        font-size: 10px;
        padding: 8px;
      }
    }
  </style>
</head>

<body>
  <div class="app">

    <!-- HEADER -->
    <div class="top-bar">
      <h1>OpenVoice</h1>
    </div>

    <!-- TABS (visual only for now) -->
    <div class="tabs" aria-label="Navigation tabs">
      <button type="button" class="active">Sentence</button>
      <button type="button">Feeling</button>
      <button type="button">Want</button>
      <button type="button">Emergency</button>
      <button type="button">Help</button>
    </div>

    <!-- SENTENCE BUILDER -->
    <div class="sentence-bar">
      <input id="sentence" placeholder="I want to…" aria-label="Sentence output" />
      <button type="button" id="speakBtn" aria-label="Speak sentence">🔊</button>
      <button type="button" id="clearBtn" aria-label="Clear sentence">🗑</button>
    </div>

    <!-- SUBJECT -->
    <h2>Subject</h2>
    <div class="grid">
      <button type="button" class="tile blue word" data-word="I"><span>I</span></button>
      <button type="button" class="tile blue word" data-word="You"><span>You</span></button>
      <button type="button" class="tile blue word" data-word="We"><span>We</span></button>
      <button type="button" class="tile blue word" data-word="They"><span>They</span></button>
      <button type="button" class="tile blue word" data-word="She"><span>She</span></button>
      <button type="button" class="tile grey"><span>＋ Add</span></button>
    </div>

    <!-- THINGS -->
    <h2>Things</h2>
    <div class="grid">
      <button type="button" class="tile purple word" data-word="Want"><span>Want</span></button>
      <button type="button" class="tile purple word" data-word="Need"><span>Need</span></button>
      <button type="button" class="tile purple word" data-word="Like"><span>Like</span></button>
      <button type="button" class="tile purple word" data-word="Have"><span>Have</span></button>
      <button type="button" class="tile purple word" data-word="See"><span>See</span></button>
      <button type="button" class="tile purple word" data-word="Go"><span>Go</span></button>
      <button type="button" class="tile purple word" data-word="Eat"><span>Eat</span></button>
      <button type="button" class="tile purple word" data-word="Drink"><span>Drink</span></button>
      <button type="button" class="tile purple word" data-word="Play"><span>Play</span></button>
      <button type="button" class="tile grey"><span>＋ Add</span></button>
    </div>

    <!-- ACTIONS -->
    <h2>Actions</h2>
    <div class="grid">
      <button type="button" class="tile green word" data-word="Water"><span>Water</span></button>
      <button type="button" class="tile green word" data-word="Food"><span>Food</span></button>
      <button type="button" class="tile green word" data-word="Help"><span>Help</span></button>
      <button type="button" class="tile green word" data-word="Break"><span>Break</span></button>
      <button type="button" class="tile green word" data-word="Bathroom"><span>Bathroom</span></button>
      <button type="button" class="tile green word" data-word="Sleep"><span>Sleep</span></button>
      <button type="button" class="tile green word" data-word="Music"><span>Music</span></button>
      <button type="button" class="tile green word" data-word="Stop"><span>Stop</span></button>
      <button type="button" class="tile grey"><span>＋ Add</span></button>
    </div>

    <!-- OTHER WORDS -->
    <h2>Other Words</h2>
    <div class="grid">
      <button type="button" class="tile orange word" data-word="Now"><span>Now</span></button>
      <button type="button" class="tile orange word" data-word="Later"><span>Later</span></button>
      <button type="button" class="tile orange word" data-word="Yes"><span>Yes</span></button>
      <button type="button" class="tile grey"><span>＋ Add</span></button>
    </div>

  </div>

  <!-- Start of code from MDN Web Speech API
       Source: https://developer.mozilla.org/en-US/docs/Web/API/Web_Speech_API -->
  <script>
    const input = document.getElementById("sentence");

    // Add icons + click behavior for each word button
    document.querySelectorAll(".word").forEach((btn) => {
      const word = btn.dataset.word;

      // Create icon element
      const img = document.createElement("img");
      img.src = `images/${word}.png`;
      img.alt = `${word} icon`;

      // If icon missing, remove it (button still works)
      img.onerror = () => img.remove();

      // Place icon above the label
      btn.prepend(img);

      // Click adds the word to the sentence bar
      btn.addEventListener("click", () => {
        input.value += (input.value ? " " : "") + word;
      });
    });

    // Clear sentence
    document.getElementById("clearBtn").addEventListener("click", () => {
      input.value = "";
    });

    // Speak sentence
    document.getElementById("speakBtn").addEventListener("click", () => {
      const text = input.value.trim();
      if (!text) return;

      // Prevent overlapping speech
      window.speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(text);
      window.speechSynthesis.speak(utterance);
    });
  </script>
  <!-- End of code from MDN Web Speech API -->
</body>
</html>
