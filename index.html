<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <!--
    Viewport meta tag based on MDN guidance
    Source: https://developer.mozilla.org/en-US/docs/Web/HTML/Viewport_meta_tag
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>OpenVoice – AAC Prototype</title>

  <style>
    /* Start of code from MDN CSS Reset / Box Model
       Source: https://developer.mozilla.org/en-US/docs/Web/CSS/box-sizing */
    * {
      box-sizing: border-box;
      font-family: system-ui, sans-serif;
    }
    /* End of code from MDN CSS Reset / Box Model */

    /* Start of code adapted from MDN Flexbox Layout
       Source: https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_Flexible_Box_Layout */
    body {
      margin: 0;
      background: #121827;
      color: #ffffff;
      display: flex;
      justify-content: center;
    }
    /* End of code adapted from MDN Flexbox Layout */

    /* App container sized to iPad Pro 11" (834px portrait)
       Source: https://developer.mozilla.org/en-US/docs/Learn/CSS/CSS_layout/Responsive_Design */
    .app {
      width: 100%;
      max-width: 834px;
      min-height: 100vh;
      padding: 16px;
    }

    /* ---------- HEADER ---------- */
    .top-bar {
      background: #1b2332;
      padding: 16px;
      text-align: center;
      border-radius: 12px;
      margin-bottom: 16px;
    }

    .top-bar h1 {
      margin: 0;
      font-size: 20px;
    }

    /* ---------- TABS ---------- */
    /* Start of code from MDN Flexbox
       Source: https://developer.mozilla.org/en-US/docs/Web/CSS/flex */
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .tabs button {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: none;
      background: #4b556b;
      color: white;
      font-size: 12px;
      cursor: pointer;
    }
    /* End of code from MDN Flexbox */

    .tabs button.active {
      background: #3f61ff;
    }

    /* ---------- SENTENCE BAR ---------- */
    .sentence-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }

    .sentence-bar input {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      border: none;
      font-size: 16px;
    }

    .sentence-bar button {
      padding: 12px;
      border-radius: 8px;
      border: none;
      background: #3a4252;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    /* ---------- SECTIONS ---------- */
    h2 {
      font-size: 14px;
      opacity: 0.8;
      margin: 16px 0 8px;
    }

    /* Start of code from MDN CSS Grid Layout
       Source: https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_Grid_Layout */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }
    /* End of code from MDN CSS Grid Layout */

    /* ---------- BUTTONS ---------- */
    /* Fallback: ensures buttons never disappear even if a color class is missing */
    button {
      background: #3a4252;
      color: white;
    }

    /* Start of code from MDN clamp() responsive sizing
       Source: https://developer.mozilla.org/en-US/docs/Web/CSS/clamp */
    .tile {
      padding: clamp(16px, 4vw, 28px);
      border-radius: 14px;
      border: none;
      font-size: clamp(14px, 2.5vw, 18px);
      cursor: pointer;
    }
    /* End of code from MDN clamp() responsive sizing */

    .tile.blue { background: #3f61ff; }
    .tile.purple { background: #7c3aed; }
    .tile.green { background: #3fb3a2; }
    .tile.orange { background: #d96b2b; }
    .tile.grey { background: #3a4252; }

    /* Start of code from MDN :focus-visible
       Source: https://developer.mozilla.org/en-US/docs/Web/CSS/:focus-visible */
    button:focus-visible,
    input:focus-visible {
      outline: 3px solid white;
      outline-offset: 2px;
    }
    /* End of code from MDN :focus-visible */

    /* ---------- RESPONSIVE ---------- */
    @media (max-width: 480px) {
      .tabs button {
        font-size: 10px;
        padding: 8px;
      }
    }
  </style>
</head>

<body>
  <div class="app">

    <div class="top-bar">
      <h1>OpenVoice</h1>
    </div>

    <div class="tabs">
      <button type="button" class="active">Sentence</button>
      <button type="button">Feeling</button>
      <button type="button">Want</button>
      <button type="button">Emergency</button>
      <button type="button">Help</button>
    </div>

    <div class="sentence-bar">
      <input id="sentence" placeholder="I want to…" aria-label="Sentence output" />
      <button type="button" id="speakBtn" aria-label="Speak sentence">🔊</button>
      <button type="button" id="clearBtn" aria-label="Clear sentence">🗑</button>
    </div>

    <h2>Subject</h2>
    <div class="grid">
      <button type="button" class="tile blue word" data-word="I">I</button>
      <button type="button" class="tile blue word" data-word="You">You</button>
      <button type="button" class="tile blue word" data-word="We">We</button>
      <button type="button" class="tile blue word" data-word="They">They</button>
      <button type="button" class="tile blue word" data-word="She">She</button>
      <button type="button" class="tile grey">＋ Add</button>
    </div>

    <h2>Things</h2>
    <div class="grid">
      <button type="button" class="tile purple word" data-word="Want">Want</button>
      <button type="button" class="tile purple word" data-word="Need">Need</button>
      <button type="button" class="tile purple word" data-word="Like">Like</button>
      <button type="button" class="tile purple word" data-word="Have">Have</button>
      <button type="button" class="tile purple word" data-word="See">See</button>
      <button type="button" class="tile purple word" data-word="Go">Go</button>
      <button type="button" class="tile purple word" data-word="Eat">Eat</button>
      <button type="button" class="tile purple word" data-word="Drink">Drink</button>
      <button type="button" class="tile purple word" data-word="Play">Play</button>
      <button type="button" class="tile grey">＋ Add</button>
    </div>

    <h2>Actions</h2>
    <div class="grid">
      <button type="button" class="tile green word" data-word="Water">Water</button>
      <button type="button" class="tile green word" data-word="Food">Food</button>
      <button type="button" class="tile green word" data-word="Help">Help</button>
      <button type="button" class="tile green word" data-word="Break">Break</button>
      <button type="button" class="tile green word" data-word="Bathroom">Bathroom</button>
      <button type="button" class="tile green word" data-word="Sleep">Sleep</button>
      <button type="button" class="tile green word" data-word="Music">Music</button>
      <button type="button" class="tile green word" data-word="Stop">Stop</button>
      <button type="button" class="tile grey">＋ Add</button>
    </div>

    <h2>Other Words</h2>
    <div class="grid">
      <button type="button" class="tile orange word" data-word="Now">Now</button>
      <button type="button" class="tile orange word" data-word="Later">Later</button>
      <button type="button" class="tile orange word" data-word="Yes">Yes</button>
      <button type="button" class="tile grey">＋ Add</button>
    </div>

  </div>

  <!-- Start of code from MDN Web Speech API
       Source: https://developer.mozilla.org/en-US/docs/Web/API/Web_Speech_API -->
  <script>
    console.log("Web Speech API loaded");

    const input = document.getElementById("sentence");

    document.querySelectorAll(".word").forEach((btn) => {
      btn.addEventListener("click", () => {
        const word = btn.dataset.word;
        input.value += (input.value ? " " : "") + word;
      });
    });

    document.getElementById("clearBtn").addEventListener("click", () => {
      input.value = "";
    });

    document.getElementById("speakBtn").addEventListener("click", () => {
      const text = input.value.trim();
      if (!text) return;

      // Prevent overlapping speech if the user presses speak multiple times
      window.speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(text);
      window.speechSynthesis.speak(utterance);
    });
  </script>
  <!-- End of code from MDN Web Speech API -->
</body>
</html>
