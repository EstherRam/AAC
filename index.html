<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OpenVoice – Refined Prototype</title>

  <style>
    * { box-sizing: border-box; font-family: system-ui, sans-serif; }

    body{
      margin:0;
      background:#0f1623;
      color:#fff;
      display:flex;
      justify-content:center;
    }

    .app{
      width:100%;
      max-width:834px; /* iPad Pro 11" portrait */
      min-height:100vh;
      padding:14px;
    }

    /* HEADER (matches your style) */
    .top-bar{
      background:#2a3246;
      border-radius:14px;
      padding:22px 16px;
      text-align:center;
      position:relative;
      margin-bottom:14px;
    }
    .top-bar h1{
      margin:0;
      font-size:54px;
      font-weight:700;
      letter-spacing:.5px;
    }
    .toggle{
      position:absolute;
      right:14px;
      top:14px;
      display:flex;
      gap:10px;
    }
    .toggle button{
      width:36px;
      height:36px;
      border-radius:10px;
      border:1px solid rgba(255,255,255,.25);
      background:rgba(255,255,255,.08);
      color:#fff;
      cursor:pointer;
    }

    /* TABS BAR */
    .tabs-bar{
      background:#8792a8;
      border-radius:14px;
      padding:10px;
      display:flex;
      gap:10px;
      align-items:center;
      margin-bottom:18px;
    }
    .tab{
      display:flex;
      align-items:center;
      gap:8px;
      padding:10px 14px;
      border-radius:12px;
      border:none;
      background:#3a4252;
      color:#fff;
      font-size:15px;
      cursor:pointer;
      white-space:nowrap;
    }
    .tab[aria-selected="true"][data-target="sentence"]{ background:#3f61ff; }
    .tab[aria-selected="true"][data-target="feeling"] { background:#c63d7a; }
    .tab[aria-selected="true"][data-target="want"]    { background:#7c3aed; }
    .tab[aria-selected="true"][data-target="emergency"]{ background:#e2553f; }
    .tab[aria-selected="true"][data-target="help"]    { background:#3a4252; }

    .tabs-bar .spacer{ flex:1; }

    /* SCREENS */
    .screen[hidden]{ display:none; }

    /* WANT GRID */
    .grid{
      display:grid;
      grid-template-columns: repeat(5, 1fr);
      gap:14px;
      padding-top:8px;
    }
    @media (max-width: 740px){ .grid{ grid-template-columns: repeat(4, 1fr);} }
    @media (max-width: 560px){ .grid{ grid-template-columns: repeat(3, 1fr);} }

    .tile{
      border:none;
      border-radius:14px;
      min-height:128px;
      padding:18px 14px;
      cursor:pointer;
      color:#fff;

      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:12px;

      box-shadow:0 10px 20px rgba(0,0,0,.35);
    }

    .tile.purple{ background:#7c3aed; }
    .tile.grey{ background:#3a4252; }

    .tile img.icon{
      width: clamp(62px, 7vw, 92px);
      height: clamp(62px, 7vw, 92px);
      object-fit:contain;
      display:block;
      /* makes dark SVG exports show as white (safe for most outline sets) */
      filter: brightness(0) invert(1);
    }

    .tile .label{
      font-size:20px;
      font-weight:500;
      line-height:1.1;
      text-align:center;
    }

    /* EMERGENCY */
    .emergency-row{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap:22px;
      padding-top:40px;
    }
    @media (max-width: 640px){
      .emergency-row{ grid-template-columns: 1fr; }
    }

    .em-card{
      border:none;
      border-radius:18px;
      overflow:hidden;
      box-shadow:0 18px 28px rgba(0,0,0,.35);
      cursor:pointer;
      min-height:330px;
    }

    .em-911{
      background:#e2553f;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:18px;
      padding:28px;
    }
    .em-911 img{
      width:120px;
      height:120px;
      object-fit:contain;
      display:block;
      filter: brightness(0) invert(1);
    }
    .em-911 .num{
      font-size:92px;
      font-weight:800;
      line-height:1;
    }

    .em-mom{
      background:#111827;
      display:flex;
      flex-direction:column;
    }
    .em-mom .photo{
      flex:1;
      background:#111827;
    }
    .em-mom .photo img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }
    .em-mom .bar{
      background:#e2553f;
      padding:22px 16px;
      text-align:center;
      font-size:52px;
      font-weight:500;
    }
    .em-mom .bar b{ font-weight:900; }

    /* Accessibility */
    button:focus-visible{
      outline:3px solid #fff;
      outline-offset:3px;
    }
  </style>
</head>

<body>
  <div class="app">
    <header class="top-bar">
      <h1>OpenVoice</h1>
      <div class="toggle" aria-hidden="true">
        <button type="button">🌙</button>
        <button type="button">☀️</button>
      </div>
    </header>

    <nav class="tabs-bar" role="tablist" aria-label="Primary navigation">
      <button class="tab" role="tab" aria-selected="true" data-target="sentence" type="button">
        Sentence building
      </button>
      <button class="tab" role="tab" aria-selected="false" data-target="feeling" type="button">
        I am feeling
      </button>
      <button class="tab" role="tab" aria-selected="false" data-target="want" type="button">
        I want
      </button>
      <button class="tab" role="tab" aria-selected="false" data-target="emergency" type="button">
        Emergency
      </button>

      <div class="spacer"></div>

      <button class="tab" role="tab" aria-selected="false" data-target="help" type="button">
        Help
      </button>
    </nav>

    <main>
      <!-- You can paste your Sentence-building screen here -->
      <section class="screen" data-screen="sentence">
        <div style="opacity:.8; padding:10px 6px;">
          Sentence building screen content goes here.
        </div>
      </section>

      <!-- You can paste your Feeling grid here -->
      <section class="screen" data-screen="feeling" hidden>
        <div style="opacity:.8; padding:10px 6px;">
          Feeling screen content goes here.
        </div>
      </section>

      <!-- WANT (matches your screenshot) -->
      <section class="screen" data-screen="want" hidden>
        <div class="grid">
          <button type="button" class="tile purple word" data-word="Bathroom"><span class="label">Bathroom</span></button>
          <button type="button" class="tile purple word" data-word="Help"><span class="label">Help</span></button>
          <button type="button" class="tile purple word" data-word="Water"><span class="label">Water</span></button>
          <button type="button" class="tile purple word" data-word="Food"><span class="label">Food</span></button>
          <button type="button" class="tile purple word" data-word="Break"><span class="label">Break</span></button>

          <button type="button" class="tile purple word" data-word="To talk"><span class="label">To talk</span></button>
          <button type="button" class="tile purple word" data-word="To run"><span class="label">To run</span></button>
          <button type="button" class="tile purple word" data-word="Play"><span class="label">Play</span></button>
          <button type="button" class="tile purple word" data-word="To read"><span class="label">To read</span></button>
          <button type="button" class="tile purple word" data-word="TV"><span class="label">TV</span></button>

          <button type="button" class="tile purple word" data-word="Quiet"><span class="label">Quiet</span></button>
          <button type="button" class="tile purple word" data-word="A hug"><span class="label">A hug</span></button>
          <button type="button" class="tile purple word" data-word="Music"><span class="label">Music</span></button>

          <button type="button" class="tile grey add">
            <span class="label">Add More</span>
          </button>
        </div>
      </section>

      <!-- EMERGENCY (matches your screenshot) -->
      <section class="screen" data-screen="emergency" hidden>
        <div class="emergency-row">
          <button type="button" class="em-card em-911" aria-label="Call 911">
            <!-- expects images/911.svg -->
            <img src="images/911.svg" alt="" />
            <div class="num">911</div>
          </button>

          <button type="button" class="em-card em-mom" aria-label="Call Mom">
            <div class="photo">
              <!-- change this filename to whatever you actually have -->
              <img src="images/Call Mom.jpg" alt="Contact photo" onerror="this.style.display='none'" />
            </div>
            <div class="bar">Call <b>Mom</b></div>
          </button>
        </div>
      </section>

      <section class="screen" data-screen="help" hidden>
        <div style="opacity:.8; padding:10px 6px;">
          Help screen content goes here.
        </div>
      </section>
    </main>
  </div>

  <script>
    // Tabs: show/hide screens
    const tabs = document.querySelectorAll(".tab");
    const screens = document.querySelectorAll(".screen");

    function showScreen(name) {
      screens.forEach(s => s.hidden = (s.dataset.screen !== name));
      tabs.forEach(t => t.setAttribute("aria-selected", String(t.dataset.target === name)));
    }
    tabs.forEach(tab => tab.addEventListener("click", () => showScreen(tab.dataset.target)));

    // Auto-load SVG icons for tiles based on their title (handles spaces!)
    document.querySelectorAll(".word").forEach((btn) => {
      const word = btn.dataset.word;

      const img = document.createElement("img");
      img.className = "icon";

      // IMPORTANT: spaces/special chars need URL encoding for GitHub Pages
      const safeName = encodeURIComponent(word);
      img.src = `images/${safeName}.svg`;

      img.alt = "";

      img.onerror = () => img.remove();

      // Insert icon above label
      btn.prepend(img);
    });
  </script>
</body>
</html>
