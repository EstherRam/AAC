<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OpenVoice – AAC Prototype</title>

  <style>
      box-sizing: border-box;
      font-family: system-ui, sans-serif;
    }

    body {
      margin: 0;
      background: #121827;
      color: #ffffff;
    }

    .app {
      max-width: 834px;          /* iPad Pro 11" width -> figma*/
      min-height: 100vh;
      margin: 0 auto;
      padding: 16px;
    }

    /* HEADER */
    .top-bar {
      background: #1b2332;
      padding: 16px;
      text-align: center;
      border-radius: 12px;
      margin-bottom: 16px;
    }

    .top-bar h1 {
      margin: 0;
      font-size: 20px;
    }

    /* TABS */
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .tabs button {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: none;
      background: #4b556b;
      color: white;
      font-size: 12px;
    }

    .tabs button.active {
      background: #3f61ff;
    }

    /* SENTENCE BAR */
    .sentence-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .sentence-bar input {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      border: none;
      font-size: 16px;
    }

    .sentence-bar button {
      padding: 12px;
      border-radius: 8px;
      border: none;
      font-size: 16px;
    }

    /* CONTENT SECTIONS */
    h2 {
      font-size: 14px;
      opacity: 0.8;
      margin: 16px 0 8px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }

    .tile {
      padding: clamp(16px, 4vw, 28px);
      border-radius: 14px;
      border: none;
      color: white;
      font-size: clamp(14px, 2.5vw, 18px);
    }

    /* COLOURS */
    .blue { background: #3f61ff; }
    .purple { background: #7c3aed; }
    .green { background: #3fb3a2; }
    .orange { background: #d96b2b; }
    .grey { background: #3a4252; }

    /* ACCESSIBILITY */
    button:focus-visible,
    input:focus-visible {
      outline: 3px solid white;
      outline-offset: 2px;
    }
  </style>
</head>

<body>
  <div class="app">

    <!-- HEADER -->
    <div class="top-bar">
      <h1>OpenVoice</h1>
    </div>

    <!-- TABS -->
    <div class="tabs">
      <button class="active">Sentence</button>
      <button>Feeling</button>
      <button>Want</button>
      <button>Emergency</button>
      <button>Help</button>
    </div>

    <!-- SENTENCE BUILDER -->
    <div class="sentence-bar">
      <input id="sentence" placeholder="I want to…" />
      <button onclick="speakSentence()">🔊</button>
      <button onclick="clearSentence()">🗑</button>
    </div>

    <!-- SUBJECT -->
    <h2>Subject</h2>
    <div class="grid">
      <button class="tile blue" onclick="addWord('I')">I</button>
      <button class="tile blue" onclick="addWord('You')">You</button>
      <button class="tile blue" onclick="addWord('We')">We</button>
      <button class="tile grey">＋ Add</button>
    </div>

    <!-- THINGS -->
    <h2>Things</h2>
    <div class="grid">
      <button class="tile purple" onclick="addWord('want')">Want</button>
      <button class="tile purple" onclick="addWord('need')">Need</button>
      <button class="tile purple" onclick="addWord('eat')">Eat</button>
      <button class="tile purple" onclick="addWord('drink')">Drink</button>
    </div>

    <!-- ACTIONS -->
    <h2>Actions</h2>
    <div class="grid">
      <button class="tile green" onclick="addWord('water')">Water</button>
      <button class="tile green" onclick="addWord('food')">Food</button>
      <button class="tile green" onclick="addWord('help')">Help</button>
      <button class="tile green" onclick="addWord('bathroom')">Bathroom</button>
    </div>

    <!-- OTHER WORDS -->
    <h2>Other Words</h2>
    <div class="grid">
      <button class="tile orange" onclick="addWord('now')">Now</button>
      <button class="tile orange" onclick="addWord('later')">Later</button>
      <button class="tile orange" onclick="addWord('yes')">Yes</button>
    </div>

  </div>

  <script>
    function addWord(word) {
      const input = document.getElementById('sentence');
      input.value += (input.value ? ' ' : '') + word;
    }

    function clearSentence() {
      document.getElementById('sentence').value = '';
    }

    function speakSentence() {
      const text = document.getElementById('sentence').value;
      if (!text) return;

      const utterance = new SpeechSynthesisUtterance(text);
      speechSynthesis.speak(utterance);
    }
  </script>
</body>
</html>
